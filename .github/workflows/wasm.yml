# Builds the browser demo parser (wasm) once; callers download the `demoparser-wasm` artifact into
# web/src/parse/demoparser. It is platform independent.
name: WASM parser

on:
  workflow_call:

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
            wasm/vendor
          key: wasm-${{ hashFiles('scripts/build-wasm.sh', 'wasm/**', '!wasm/target/**', '!wasm/vendor/**') }}
          restore-keys: wasm-
      - name: Install toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xz --strip-components=1 -C ~/.cargo/bin wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack
          curl -sSL -o protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip
          unzip -q protoc.zip -d "$HOME/protoc" && echo "PROTOC=$HOME/protoc/bin/protoc" >> "$GITHUB_ENV"
      - run: bash scripts/build-wasm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: demoparser-wasm
          path: web/src/parse/demoparser
          if-no-files-found: error

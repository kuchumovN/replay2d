# Builds desktop installers on real macOS (Apple Silicon) and Windows machines.
# Pushing a tag vX.Y.Z publishes them as a GitHub Release; a manual run only uploads workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wasm:
    uses: ./.github/workflows/wasm.yml

  build:
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: demoparser-wasm
          path: web/src/parse/demoparser
      - run: npm run typecheck
      - run: npm test
      - run: npm run fetch-maps
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v7
        with:
          name: replay2d-${{ runner.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: replay2d-*
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: installers/*
          generate_release_notes: true
